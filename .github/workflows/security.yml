name: security-pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      FARADAY_URL: https://manaos.apps.faradaysec.com
      WS: vercel-sandbox-graveyard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- SAST: SonarCloud (cloud analysis) ---
      - name: SonarQube (SonarCloud) scan
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # --- faraday-cli auth (token via config file; auth has no --token flag) ---
      - name: Setup faraday-cli
        run: |
          pip install --quiet faraday-cli
          cat > ~/.faraday-cli.yml <<YAML
          auth:
            faraday_url: ${{ env.FARADAY_URL }}
            ignore_ssl: false
            token: ${{ secrets.FARADAY_TOKEN }}
          YAML

      # --- Import SonarCloud issues into Faraday ---
      - name: Import SonarCloud issues into Faraday
        run: |
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=f-amato_sandbox-graveyard&resolved=false&ps=500" \
            -o sonarqube.json
          echo "SonarCloud issues: $(python3 -c 'import json;print(len(json.load(open("sonarqube.json")).get("issues",[])))')"
          faraday-cli tool report sonarqube.json -w "$WS" --create-workspace

      # --- DAST: Dastardly (Burp) against the live deployment ---
      # Manual-only (workflow_dispatch): the ~10-min Burp scan is skipped on
      # normal pushes; the last report is reused instead of re-scanning.
      - name: Dastardly DAST
        if: github.event_name == 'workflow_dispatch'
        uses: PortSwigger/dastardly-github-action@main
        continue-on-error: true
        with:
          target-url: https://sandbox-graveyard.vercel.app/

      # Dastardly emits JUnit XML (no faraday-cli plugin), so convert -> bulk_create
      - name: Import Dastardly report into Faraday
        if: github.event_name == 'workflow_dispatch'
        env:
          FARADAY_TOKEN: ${{ secrets.FARADAY_TOKEN }}
        run: |
          ls -la *.xml || true
          if [ -f dastardly-report.xml ]; then
            head -c 1200 dastardly-report.xml; echo
            python3 scripts/dastardly_to_faraday.py dastardly-report.xml
          else
            echo "no dastardly-report.xml produced"
          fi

      - name: Upload Dastardly report artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dastardly-report
          path: dastardly-report.xml
          if-no-files-found: ignore

      # === Phase 2: FaradAI (autonomous pentest + triage/patching) ===
      # These use the FaradAI dispatcher agent's `aipentest` and `triage`
      # executors. Set the FARADAI_AGENT_ID secret once that agent is
      # registered to Faraday. Manual-only + continue-on-error until then.

      # FaradAI autonomous pentest over the live deployment
      - name: FaradAI scan
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          faraday-cli agent run \
            -a "${{ secrets.FARADAI_AGENT_ID }}" \
            -e aipentest \
            -w "$WS" \
            -p '{
              "TARGET": "https://sandbox-graveyard.vercel.app/",
              "INSTRUCTION": "Full recon + web-app pentest: auth, IDOR, SSRF, API abuse, exposed secrets",
              "MODE": "dual",
              "ROUNDS": "5"
            }'

      # FaradAI triage & patching over the whole workspace (all sources)
      - name: FaradAI triage
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          faraday-cli agent run \
            -a "${{ secrets.FARADAI_AGENT_ID }}" \
            -e triage \
            -w "$WS" \
            -p '{
              "WORKSPACE_NAME": "vercel-sandbox-graveyard",
              "MODE": "dual",
              "PATCHING_MODE": "dry-run"
            }'
